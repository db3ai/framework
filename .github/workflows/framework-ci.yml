name: Framework checks

on:
  push:
    branches: [main, '[0-9]*.x']
  pull_request:
    branches: [main, '[0-9]*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'worker' || 'automatic' }}
  cancel-in-progress: true

jobs:
  framework:
    # This workflow is exported into the dedicated public repository only.
    if: github.repository == 'db3ai/framework' && github.event.repository.visibility == 'public'
    # Self-hosted execution is manual so pull requests never run on the persistent worker.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["self-hosted","Linux","ARM64","framework-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 13306
      TEST_DB_PORT: 13306
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_PASSWORD: root
      QUEUE_REDIS_URL: redis://127.0.0.1:16379
      QUEUE_REDIS_PREFIX: db3:ci
      TEST_REDIS_REQUIRED: '1'
      OPENAI_API_KEY: ''
    services:
      mariadb:
        # Pin the multi-platform index for hosted amd64 and worker ARM64.
        image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        # The worker's post-job hook removes only this run's disposable database volume.
        volumes:
          - framework-ci-mariadb-${{ github.run_id }}-${{ github.run_attempt }}:/var/lib/mysql
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        # Pin the multi-platform index for hosted amd64 and worker ARM64.
        image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
        ports:
          - 16379:6379
        volumes:
          - framework-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}:/data
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out public source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install public workspaces
        run: npm ci --ignore-scripts

      - name: Type-check source and examples
        run: npm run check

      - name: Test Dock projects, terminals and host routes
        # npm ci skips lifecycle scripts; node-pty ships no Linux prebuilt binary.
        run: npm rebuild node-pty && npm test --workspace db3-dock

      - name: Test Pure, Create and Starter
        run: npm test --workspace @db3.ai/pure && npm test --workspace @db3.ai/create && npm test --workspace db3-starter

      - name: Install Chromium on the Framework worker
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium

      - name: Install Chromium on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium

      - name: Test App with coverage and required MariaDB and Redis
        run: npm run test:coverage --workspace @db3.ai/app

      - name: Upload App coverage to Codacy
        if: github.event_name == 'push' && !cancelled()
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: db3ai
          CODACY_PROJECT_NAME: framework
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --commit-uuid "$GITHUB_SHA" --language TypeScript --prefix packages/app/ --coverage-reports packages/app/coverage/lcov.info

      - name: Build the runnable starter workspace
        run: npm run build --workspace db3-starter

      - name: Verify packed App and Pure consumers
        run: npm run framework:package:test

      - name: Verify packed Create and its generated application
        run: npm run framework:create:test

      - name: Verify release policy
        run: npm run framework:release:test && npm run framework:publish:test
