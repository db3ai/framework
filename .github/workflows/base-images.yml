name: Base images

# db3's shared base images, built for ARM and Intel and published to ghcr.io/db3ai. Rebuilt when
# they change and weekly, so security fixes in Debian and Node reach every app on its next deploy.
on:
  push:
    branches: [main]
    paths: [deploy/images/**, .github/workflows/base-images.yml]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-images
  cancel-in-progress: false

jobs:
  versions:
    if: github.repository == 'db3ai/framework'
    runs-on: ubuntu-24.04
    outputs:
      node: ${{ steps.read.outputs.node }}
      playwright: ${{ steps.read.outputs.playwright }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: read
        run: |
          echo "node=$(jq -r .node deploy/images/versions.json)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(jq -c .playwright deploy/images/versions.json)" >> "$GITHUB_OUTPUT"

  node-browser:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        playwright: ${{ fromJSON(needs.versions.outputs.playwright) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/node-browser
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            NODE_VERSION=${{ needs.versions.outputs.node }}
            PLAYWRIGHT_VERSION=${{ matrix.playwright }}
          tags: |
            ghcr.io/db3ai/node-browser:${{ needs.versions.outputs.node }}-playwright-${{ matrix.playwright }}
            ghcr.io/db3ai/node-browser:24-playwright-${{ matrix.playwright }}
          # GitHub shows the description and documentation link on the package page; for a
          # multi-arch image they must be on the index, so they are annotations too.
          labels: |
            org.opencontainers.image.source=https://github.com/db3ai/framework
            org.opencontainers.image.description=Node 24 with Playwright Chromium for db3 apps, ARM and Intel
            org.opencontainers.image.documentation=https://github.com/db3ai/framework/tree/main/deploy/images/node-browser#readme
          annotations: |
            index:org.opencontainers.image.source=https://github.com/db3ai/framework
            index:org.opencontainers.image.description=Node 24 with Playwright Chromium for db3 apps, ARM and Intel. See https://github.com/db3ai/framework/tree/main/deploy/images/node-browser
            index:org.opencontainers.image.documentation=https://github.com/db3ai/framework/tree/main/deploy/images/node-browser#readme
