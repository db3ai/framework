name: Publish framework

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated framework-v tag to verify without publishing
        required: true
        type: string

permissions:
  contents: read

# Serialize all releases so two versions cannot race their npm distribution tags.
concurrency:
  group: framework-npm-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'db3ai/framework' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      revision: ${{ steps.release.outputs.revision }}
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      QUEUE_REDIS_URL: redis://127.0.0.1:6379
      QUEUE_REDIS_PREFIX: db3:release
      TEST_REDIS_REQUIRED: '1'
      OPENAI_API_KEY: ''
    services:
      mariadb:
        image: mariadb:11.8.3@sha256:1cc14cc479613f2925315a5da7aa0eb5288f938565d94b56cd137b724d2ea12b
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.2.1-alpine@sha256:f887e6dacdcfa8e14af2f625fdf4474ff8c37dc36ce13b9e89e6e9a901f155ad
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out public source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Validate release identity
        id: release
        run: node scripts/check-github-framework-release.mjs

      - name: Install public workspaces
        run: npm ci --ignore-scripts

      - name: Type-check source and examples
        run: npm run check

      - name: Test Pure, Create and Starter
        run: npm test --workspace @db3.ai/pure && npm test --workspace @db3.ai/create && npm test --workspace db3-starter

      - name: Install Chromium for browser network guard tests
        run: npx playwright install --with-deps chromium

      - name: Test App with coverage and required MariaDB and Redis
        run: npm run test:coverage --workspace @db3.ai/app

      - name: Build the runnable starter workspace
        run: npm run build --workspace db3-starter

      - name: Verify packed App and Pure consumers
        run: npm run framework:package:test

      - name: Verify packed Create and its generated application
        run: npm run framework:create:test

      - name: Verify release policy
        run: npm run framework:release:test && npm run framework:publish:test

      - name: Inspect exact versioned package artifacts without publishing
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm run framework:publish -- --version "$RELEASE_VERSION" --tag "$RELEASE_CHANNEL" --provenance --dry-run

  publish:
    needs: verify
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Recheck release context
        run: node scripts/check-github-framework-release.mjs

      - name: Install locked build dependencies
        run: npm ci --ignore-scripts

      - name: Publish Pure, App and Create with OIDC and provenance
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
        run: npm run framework:publish -- --version "$RELEASE_VERSION" --tag "$RELEASE_CHANNEL" --provenance --skip-existing

      - name: Verify public package archives
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/verify-published-framework.mjs "$RELEASE_VERSION"
