<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		>
		<meta name="referrer" content="strict-origin-when-cross-origin">
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171717'/%3E%3Cpath d='M17 18h14c11 0 18 5 18 14S42 46 31 46H17V18Zm13 20c5 0 8-2 8-6s-3-6-8-6h-2v12h2Z' fill='%23fff'/%3E%3C/svg%3E">
		<script>
			let themeMode = 'system';

			try {
				themeMode = localStorage.getItem('theme-mode') || 'system';
			} catch {
				// Restricted storage falls back to the operating-system preference.
			}

			const prefersDarkTheme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
			document.documentElement.dataset.theme = themeMode === 'dark' || (themeMode === 'system' && prefersDarkTheme)
				? 'dark'
				: 'light';
		</script>
		<!--platform-ssr-head-->
	</head>
	<body>
		<div id="app"><!--platform-ssr-app--></div>
		<script id="platform-ssr-state" type="application/json"><!--platform-ssr-state--></script>
		<script
			type="module"
			src="/src/entry-client.ts"
		></script>
	</body>
</html>
