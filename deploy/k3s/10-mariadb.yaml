apiVersion: v1
kind: Service
metadata: { name: mariadb, namespace: db3-starter }
spec:
  type: ClusterIP
  selector: { app: mariadb }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mariadb, namespace: db3-starter }
spec:
  serviceName: mariadb
  replicas: 1
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: db3_app }
            - { name: MARIADB_USER, value: db3_app }
            - { name: MARIADB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: db3-secrets, key: MARIADB_ROOT_PASSWORD } } }
            - { name: MARIADB_PASSWORD, valueFrom: { secretKeyRef: { name: db3-secrets, key: DB_PASSWORD } } }
            - { name: MARIADB_INNODB_BUFFER_POOL_SIZE, value: 64M }
          args: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
          resources:
            requests: { memory: 192Mi, cpu: 100m }
            limits: { memory: 512Mi }
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 3
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 2Gi } }
